# Actions are pinned to commit SHAs so an upstream release cannot turn master red.
# One job per tool, so one failing never hides the others.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The GTK/libadwaita dev packages the crates link against (GTK 4.14, libadwaita 1.5 on 24.04).
  APT_DEPS: libgtk-4-dev libadwaita-1-dev libsqlite3-dev liblzma-dev

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_DEPS
      - run: cargo clippy --all-targets -- -D warnings

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_DEPS
      - run: cargo test

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run --spec shellcheck-py==0.11.0.1 shellcheck install.sh

  # Builds and installs the Arch package the way install.sh does, from the checkout.
  arch-package:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rust gtk4 libadwaita sqlite librsvg xz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # pkgver() counts the commits
      - name: makepkg as an unprivileged user
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && TANGO_GIT_URL='file://$GITHUB_WORKSPACE' makepkg --noconfirm"
      - run: pacman -U --noconfirm packaging/arch/*.pkg.tar.zst && tango --version
